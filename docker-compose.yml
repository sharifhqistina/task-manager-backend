version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: task_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: task_db
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./task-manager-backend
    container_name: task_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: task_db
    depends_on:
      - db

  frontend:
    build: ./task-manager-frontend
    container_name: task_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres-data:
