<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My Task Board</h1>
            <form id="task-form">
                <input type="text" id="task-input" placeholder="What needs to be done?" required>
                <button type="submit">Add Task</button>
            </form>
        </header>

        <main class="board">
            <section class="column" id="pending-column">
                <h2>Pending</h2>
                <ul id="pending-list" class="task-list"></ul>
            </section>

            <section class="column" id="in-progress-column">
                <h2>In Progress</h2>
                <ul id="in-progress-list" class="task-list"></ul>
            </section>

            <section class="column" id="completed-column">
                <h2>Completed</h2>
                <ul id="completed-list" class="task-list"></ul>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
